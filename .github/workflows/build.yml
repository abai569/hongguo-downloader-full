name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build:react

      - name: Fetch bundled ffmpeg
        run: node scripts/setup-ffmpeg.js

      - name: Package Electron app
        run: npx electron-builder --win --x64 ${{ !startsWith(github.ref, 'refs/tags/v') && '--publish=never' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-downloader-setup
          path: |
            dist/*Setup*.exe
          if-no-files-found: warn
